<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>画像台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDEAE0;
    --card: #F7F5EE;
    --ink: #262019;
    --ink-soft: #6B6252;
    --rule: #C9C2AE;
    --navy: #2F3B54;
    --brick: #8C3527;
    --mustard: #A8791E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.6;
  }

  h1, h2, h3 { font-family: 'Noto Serif JP', serif; margin: 0; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
  }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .title-block { display: flex; align-items: baseline; gap: 16px; }

  header h1 { font-size: 22px; font-weight: 700; }
  header p { color: var(--ink-soft); font-size: 13px; margin: 0; }

  .header-right { display: flex; align-items: center; gap: 18px; }

  .auth-area { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .auth-area input[type="email"] {
    padding: 6px 8px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-size: 12px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
  }

  .picker-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
    cursor: pointer;
  }
  .picker-row:hover { background: rgba(47, 59, 84, 0.06); }
  .picker-row:last-child { border-bottom: none; }
  .picker-thumb {
    width: 32px; height: 32px;
    object-fit: cover;
    border-radius: 2px;
    background: var(--paper);
    flex-shrink: 0;
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: calc(100vh - 90px);
  }

  aside {
    border-right: 1px solid var(--rule);
    padding: 24px 20px;
  }

  aside h2 { font-size: 14px; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 16px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .field input[type="text"],
  .field input[type="date"],
  .field textarea,
  .field select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    border-radius: 2px;
  }
  .field textarea { resize: vertical; }
  .checkrow { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 8px; }
  .checkbox-group { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
  .checkbox-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .tag-chip-input-box {
    border: 1px solid var(--rule);
    background: var(--card);
    border-radius: 2px;
    padding: 6px;
  }
  .tag-chip-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .tag-chip-list:empty { margin-bottom: 0; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 2px 4px 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    color: var(--ink);
    background: var(--paper);
  }
  .tag-chip button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 12px;
    padding: 0 4px;
  }
  .tag-chip-input-box input[type="text"] {
    width: 100%;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    padding: 2px;
  }
  .tag-chip-input-box input[type="text"]:focus { outline: none; }
  .tag-suggest-wrap { position: relative; }
  .tag-suggest-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 20;
    background: var(--card);
    border: 1px solid var(--rule);
    border-top: none;
    max-height: 160px;
    overflow-y: auto;
  }
  .tag-suggest-item { padding: 6px 8px; font-size: 12px; cursor: pointer; }
  .tag-suggest-item:hover { background: rgba(47, 59, 84, 0.08); }

  .copy-btn { border: none; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .copy-btn:hover { color: var(--navy); }

  button {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--navy);
    background: var(--navy);
    color: var(--paper);
    padding: 8px 14px;
    border-radius: 2px;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--navy); }
  button.danger { border-color: var(--brick); background: var(--brick); }
  button.small { padding: 4px 9px; font-size: 12px; }
  button:hover { opacity: 0.85; }

  main { padding: 24px 32px; }

  .main-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }
  .card.deleted { opacity: 0.5; }

  .cover {
    aspect-ratio: 4 / 3;
    background: repeating-linear-gradient(45deg, #E4E0D2, #E4E0D2 8px, #DAD5C4 8px, #DAD5C4 16px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 11px;
    text-align: center;
    padding: 8px;
  }

  .card.is-owned { background: #E7EFE1; border-color: #9AB98C; }
  .card.is-not-owned { background: #F5EDE0; border-color: #C9A968; }

  .image-count-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(38, 32, 25, 0.72);
    color: var(--paper);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .card-body { padding: 12px; }
  .card-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
  }
  .tag.person { border-color: var(--brick); color: var(--brick); }
  .tag.creator { border-color: var(--mustard); color: var(--mustard); }

  .card-comment {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .card-source {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
    font-size: 10px;
  }
  .card-source-url {
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  dialog {
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0;
    width: 560px;
    max-width: 92vw;
  }
  dialog::backdrop { background: rgba(38, 32, 25, 0.4); }
  .dialog-inner { padding: 24px; max-height: 80vh; overflow-y: auto; }
  .dialog-inner h2 { font-size: 18px; margin-bottom: 16px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  #dlg-viewer {
    width: 90vw;
    max-width: 1100px;
    background: #1B1712;
    border: none;
  }
  #dlg-viewer::backdrop { background: rgba(10, 8, 6, 0.8); }
  .viewer-inner {
    position: relative;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .viewer-close {
    position: absolute;
    top: 8px;
    right: 12px;
    background: transparent;
    border: none;
    color: #EDEAE0;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 6px;
  }
  .viewer-image-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 200px;
  }
  .viewer-img { max-width: 100%; max-height: 75vh; object-fit: contain; }
  .viewer-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(237, 234, 224, 0.15);
    color: #EDEAE0;
    border: none;
    font-size: 26px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
  }
  .viewer-nav:hover { background: rgba(237, 234, 224, 0.3); }
  .viewer-prev { left: 4px; }
  .viewer-next { right: 4px; }
  .viewer-caption { margin-top: 14px; color: #C9C2AE; font-size: 12px; }

  .image-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .image-row input[type="text"] { flex: 1; }
  .image-row .img-name { flex: 1; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>画像台帳</h1>
    <p>OneDrive上の画像を投稿単位でタグ管理する</p>
  </div>
  <div class="header-right">
    <div id="auth-area" class="auth-area"></div>
    <div id="od-auth-area" class="auth-area"></div>
  </div>
</header>

<div class="layout" id="layout">
  <aside>
    <h2>検索</h2>
    <div class="field">
      <label>タイトル</label>
      <input type="text" id="f-title" placeholder="部分一致で検索" />
    </div>
    <div class="field">
      <label>カテゴリ(複数選択可)</label>
      <div id="f-category-group" class="checkbox-group">
        <label><input type="checkbox" value="photo" /> 写真</label>
        <label><input type="checkbox" value="illustration" /> イラスト</label>
        <label><input type="checkbox" value="comic" /> 漫画</label>
        <label><input type="checkbox" value="anime" /> アニメ</label>
        <label><input type="checkbox" value="video" /> ビデオ</label>
        <label><input type="checkbox" value="magazine" /> 雑誌</label>
        <label><input type="checkbox" value="movie" /> 映画</label>
      </div>
    </div>
    <div class="field">
      <label>所有状況(ビデオ)</label>
      <select id="f-owned">
        <option value="">すべて</option>
        <option value="true">所有している</option>
        <option value="false">所有していない</option>
      </select>
    </div>
    <div class="field">
      <label>内容タグ (AND)</label>
      <div id="f-content-tags-wrap"></div>
    </div>
    <div class="field">
      <label>人物タグ (AND)</label>
      <div id="f-person-tags-wrap"></div>
    </div>
    <div class="field">
      <label>作者タグ (AND)</label>
      <div id="f-creator-tags-wrap"></div>
    </div>
    <div class="checkrow"><input type="checkbox" id="f-liked" /> <label for="f-liked">いいねのみ</label></div>
    <div class="checkrow"><input type="checkbox" id="f-deleted" /> <label for="f-deleted">削除済みも表示</label></div>
    <div class="field">
      <label>並び替え</label>
      <select id="f-sort">
        <option value="updated_at">更新日</option>
        <option value="production_date">制作日</option>
        <option value="usage_count">使用回数</option>
      </select>
    </div>
    <button id="btn-search" style="width:100%;">検索する</button>
    <button id="btn-clear" class="ghost" style="width:100%; margin-top:8px;">クリア</button>
  </aside>

  <main>
    <div class="main-head">
      <h2 class="mono" id="result-count" style="font-size:13px; color:var(--ink-soft);">-</h2>
      <button id="btn-new">＋ 新規登録</button>
    </div>
    <div class="grid" id="results"></div>
    <div style="text-align:center; margin-top:20px;">
      <button id="btn-load-more" class="ghost" style="display:none;">もっと読み込む</button>
    </div>
  </main>
</div>

<dialog id="dlg-new">
  <div class="dialog-inner">
    <h2>新規登録</h2>
    <div class="field">
      <label>タイトル</label>
      <input type="text" id="n-title" />
    </div>
    <div class="row2">
      <div class="field">
        <label>カテゴリ</label>
        <select id="n-category">
          <option value="photo">写真</option>
          <option value="illustration">イラスト</option>
          <option value="comic">漫画</option>
          <option value="anime">アニメ</option>
          <option value="video">ビデオ</option>
          <option value="magazine">雑誌</option>
          <option value="movie">映画</option>
        </select>
      </div>
      <div class="field">
        <label>制作日(わかる範囲で)</label>
        <input type="date" id="n-date" />
      </div>
    </div>
    <div class="field">
      <label>制作日の精度</label>
      <select id="n-date-precision">
        <option value="unknown">不明</option>
        <option value="year">年のみ</option>
        <option value="month">年月</option>
        <option value="day">年月日</option>
      </select>
    </div>
    <div class="checkrow"><input type="checkbox" id="n-liked" /> <label for="n-liked">いいね</label></div>
    <div class="checkrow" id="n-owned-wrap" style="display:none;">
      <input type="checkbox" id="n-owned" /> <label for="n-owned">実体を所有している</label>
    </div>

    <div class="field">
      <label>内容タグ</label>
      <div id="n-content-tags-wrap"></div>
    </div>
    <div class="field">
      <label>人物タグ</label>
      <div id="n-person-tags-wrap"></div>
    </div>
    <div class="field">
      <label>作者タグ</label>
      <div id="n-creator-tags-wrap"></div>
    </div>

    <div class="field">
      <label>コメント</label>
      <textarea id="n-comment" rows="3" autocomplete="off"></textarea>
    </div>
    <div class="field">
      <label>引用元URL</label>
      <input type="text" id="n-source-url" autocomplete="off" placeholder="https://..." />
    </div>

    <div class="field">
      <label>画像</label>
      <div id="n-images"></div>
      <button type="button" class="ghost small" id="btn-open-picker">OneDriveから選択</button>
      <button type="button" class="ghost small" id="btn-add-image">＋ 手入力で追加</button>
    </div>

    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-cancel">キャンセル</button>
      <button type="button" id="btn-save">登録する</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-picker">
  <div class="dialog-inner">
    <h2>OneDriveから選択</h2>
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
      <div id="picker-breadcrumb" class="mono" style="font-size:12px;color:var(--ink-soft);"></div>
      <div style="display:flex; gap:6px;">
        <button type="button" class="ghost small" id="btn-picker-select-all">すべて選択</button>
        <button type="button" class="ghost small" id="btn-picker-clear">選択解除</button>
      </div>
    </div>
    <div id="picker-list" style="max-height:360px;overflow-y:auto;border:1px solid var(--rule);border-radius:2px;"></div>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-picker-cancel">キャンセル</button>
      <button type="button" id="btn-picker-add">選択した画像を追加</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-viewer">
  <div class="viewer-inner">
    <button type="button" class="viewer-close" id="btn-viewer-close">×</button>
    <div class="viewer-image-wrap">
      <button type="button" class="viewer-nav viewer-prev" id="btn-viewer-prev">‹</button>
      <img id="viewer-img" class="viewer-img" alt="" />
      <button type="button" class="viewer-nav viewer-next" id="btn-viewer-next">›</button>
    </div>
    <div class="viewer-caption mono" id="viewer-caption"></div>
  </div>
</dialog>

<dialog id="dlg-edit">
  <div class="dialog-inner">
    <h2>投稿を編集</h2>
    <div class="field">
      <label>タイトル</label>
      <input type="text" id="e-title" />
    </div>
    <div class="row2">
      <div class="field">
        <label>カテゴリ</label>
        <select id="e-category">
          <option value="photo">写真</option>
          <option value="illustration">イラスト</option>
          <option value="comic">漫画</option>
          <option value="anime">アニメ</option>
          <option value="video">ビデオ</option>
          <option value="magazine">雑誌</option>
          <option value="movie">映画</option>
        </select>
      </div>
      <div class="field">
        <label>制作日(わかる範囲で)</label>
        <input type="date" id="e-date" />
      </div>
    </div>
    <div class="field">
      <label>制作日の精度</label>
      <select id="e-date-precision">
        <option value="unknown">不明</option>
        <option value="year">年のみ</option>
        <option value="month">年月</option>
        <option value="day">年月日</option>
      </select>
    </div>
    <div class="checkrow"><input type="checkbox" id="e-liked" /> <label for="e-liked">いいね</label></div>
    <div class="checkrow" id="e-owned-wrap" style="display:none;">
      <input type="checkbox" id="e-owned" /> <label for="e-owned">実体を所有している</label>
    </div>

    <div class="field">
      <label>内容タグ</label>
      <div id="e-content-tags-wrap"></div>
    </div>
    <div class="field">
      <label>人物タグ</label>
      <div id="e-person-tags-wrap"></div>
    </div>
    <div class="field">
      <label>作者タグ</label>
      <div id="e-creator-tags-wrap"></div>
    </div>

    <div class="field">
      <label>コメント</label>
      <textarea id="e-comment" rows="3" autocomplete="off"></textarea>
    </div>
    <div class="field">
      <label>引用元URL</label>
      <input type="text" id="e-source-url" autocomplete="off" placeholder="https://..." />
    </div>

    <div class="field">
      <label>画像 (追加・削除・並び替え・カバー変更はすぐに反映されます)</label>
      <div id="e-images"></div>
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button type="button" class="ghost small" id="btn-e-open-picker">OneDriveから選択</button>
        <button type="button" class="ghost small" id="btn-e-add-image">＋ 手入力で追加</button>
      </div>
    </div>

    <div class="field" style="border-top:1px solid var(--rule); padding-top:14px;">
      <label>使用回数・削除</label>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="mono" id="e-usage-count" style="font-size:13px;">使用0回</span>
        <button type="button" class="ghost small" id="btn-e-usage-minus">使用－1</button>
        <button type="button" class="ghost small" id="btn-e-usage-plus">使用＋1</button>
        <button type="button" class="danger small" id="btn-e-delete">論理削除</button>
        <button type="button" class="ghost small" id="btn-e-restore" style="display:none;">復元</button>
      </div>
    </div>

    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-edit-cancel">閉じる</button>
      <button type="button" id="btn-edit-save">タイトル/タグなどを保存</button>
    </div>
  </div>
</dialog>

<dialog id="dlg-confirm">
  <div class="dialog-inner">
    <h2 id="confirm-title">確認</h2>
    <p id="confirm-message" style="font-size:13px;color:var(--ink-soft);margin:0;"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-confirm-cancel">キャンセル</button>
      <button type="button" class="danger" id="btn-confirm-ok">実行する</button>
    </div>
  </div>
</dialog>

<script type="module">
  import {
    createPost, searchPosts, softDeletePost, restorePost, incrementUsageCount, decrementUsageCount, listImages,
    updatePost, replaceTags, addImages, setCoverImage, deleteImage, reorderImages, getPost, searchTags,
    signInWithMagicLink, signOut, getCurrentSession, onAuthStateChange,
  } from './api.js';
  import {
    getOneDriveAccount, signInOneDrive, getMyDriveId, listFolder, getThumbnailUrl, getDownloadUrl,
  } from './onedrive.js';

  const CATEGORY_NAME  = { photo: '写真', illustration: 'イラスト', comic: '漫画', anime: 'アニメ', video: 'ビデオ', magazine: '雑誌', movie: '映画' };

  const resultsEl = document.getElementById('results');
  const countEl = document.getElementById('result-count');

  function splitTags(value) {
    return value.split(',').map((s) => s.trim()).filter(Boolean);
  }

  // "foo.bar.png" -> "foo.bar" のように最後の拡張子だけを取り除く
  function stripExtension(filename) {
    const idx = filename.lastIndexOf('.');
    return idx > 0 ? filename.slice(0, idx) : filename;
  }

  // タグのチップ入力(namespace内の既存タグを候補に出す。重複追加は自動で無視)。
  // input要素はブラウザの入力履歴オートコンプリートを autocomplete="off" で止めている。
  function createTagChipInput(containerEl, namespace) {
    let tags = [];
    containerEl.innerHTML = `
      <div class="tag-chip-input-box">
        <div class="tag-chip-list"></div>
        <div class="tag-suggest-wrap">
          <input type="text" class="mono" autocomplete="off" placeholder="タグを入力してEnter" />
          <div class="tag-suggest-list" style="display:none;"></div>
        </div>
      </div>
    `;
    const chipListEl = containerEl.querySelector('.tag-chip-list');
    const inputEl = containerEl.querySelector('input[type="text"]');
    const suggestEl = containerEl.querySelector('.tag-suggest-list');

    function renderChips() {
      chipListEl.innerHTML = tags
        .map((t, i) => `<span class="tag-chip">${t}<button type="button" data-i="${i}">×</button></span>`)
        .join('');
      chipListEl.querySelectorAll('button').forEach((btn) => {
        btn.onclick = () => {
          tags.splice(Number(btn.dataset.i), 1);
          renderChips();
        };
      });
    }

    function hideSuggest() {
      suggestEl.style.display = 'none';
      suggestEl.innerHTML = '';
    }

    function addTag(name) {
      const trimmed = name.trim();
      if (trimmed && !tags.includes(trimmed)) tags.push(trimmed);
      inputEl.value = '';
      hideSuggest();
      renderChips();
    }

    let debounceTimer = null;
    inputEl.addEventListener('input', () => {
      const query = inputEl.value.trim();
      clearTimeout(debounceTimer);
      if (!query) { hideSuggest(); return; }
      debounceTimer = setTimeout(async () => {
        let results;
        try {
          results = await searchTags(namespace, query, 8);
        } catch {
          return;
        }
        const filtered = results.filter((r) => !tags.includes(r.name));
        if (filtered.length === 0) { hideSuggest(); return; }
        suggestEl.innerHTML = filtered
          .map((r) => `<div class="tag-suggest-item">${r.name}</div>`)
          .join('');
        suggestEl.style.display = '';
        suggestEl.querySelectorAll('.tag-suggest-item').forEach((el) => {
          el.onmousedown = (e) => { e.preventDefault(); addTag(el.textContent); };
        });
      }, 200);
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        addTag(inputEl.value);
      } else if (e.key === 'Backspace' && inputEl.value === '' && tags.length > 0) {
        tags.pop();
        renderChips();
      }
    });
    inputEl.addEventListener('blur', () => {
      // クリック選択(mousedown)より先にblurが走ってしまわないよう少し待つ
      setTimeout(hideSuggest, 150);
    });

    return {
      getTags: () => [...tags],
      setTags: (newTags) => { tags = [...(newTags || [])]; renderChips(); },
    };
  }

        <img class="picker-thumb" />
        <label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);white-space:nowrap;">
          <input type="radio" name="e-cover" ${img.id === currentPost.cover_image_id ? 'checked' : ''} /> カバー
        </label>
        <span class="img-name mono">${img.onedrive_item_id}</span>
        <button type="button" class="ghost small" data-action="up">↑</button>
        <button type="button" class="ghost small" data-action="down">↓</button>
        <button type="button" class="danger small" data-action="remove">削除</button>
      `;
      row.querySelector('input[type="radio"]').onchange = async () => {
        await setCoverImage(editPostId, img.id);
        runSearch();
      };
      row.querySelector('[data-action="up"]').onclick = async () => {
        if (idx === 0) return;
        const ids = editImages.map((i) => i.id);
        [ids[idx - 1], ids[idx]] = [ids[idx], ids[idx - 1]];
        await reorderImages(editPostId, ids);
        await refreshEditImages();
      };
      row.querySelector('[data-action="down"]').onclick = async () => {
        if (idx === editImages.length - 1) return;
        const ids = editImages.map((i) => i.id);
        [ids[idx + 1], ids[idx]] = [ids[idx], ids[idx + 1]];
        await reorderImages(editPostId, ids);
        await refreshEditImages();
      };
      row.querySelector('[data-action="remove"]').onclick = async () => {
        const ok = await confirmAction('この画像を投稿から外しますか？(OneDrive上のファイルは削除されません)');
        if (!ok) return;
        await deleteImage(img.id);
        await refreshEditImages();
        runSearch();
      };
      container.appendChild(row);

      getOneDriveAccount().then((account) => {
        if (!account) return;
        getThumbnailUrl(img.onedrive_drive_id, img.onedrive_item_id, 'small').then((url) => {
          if (url) row.querySelector('.picker-thumb').src = url;
        });
      });
    });
  }

  document.getElementById('btn-e-open-picker').onclick = () => openPicker(async (selections) => {
    if (selections.length === 0) return;
    const titleInput = document.getElementById('e-title');
    if (!titleInput.value.trim() && selections[0].name) {
      titleInput.value = stripExtension(selections[0].name);
    }
    const base = editImages.length;
    await addImages(
      editPostId,
      selections.map((sel, i) => ({ driveId: sel.driveId, itemId: sel.itemId, sortOrder: base + i }))
    );
    await refreshEditImages();
    runSearch();
  });

  document.getElementById('btn-e-add-image').onclick = async () => {
    const driveId = prompt('driveIdを入力してください');
    if (!driveId) return;
    const itemId = prompt('itemIdを入力してください');
    if (!itemId) return;
    await addImages(editPostId, [{ driveId: driveId.trim(), itemId: itemId.trim(), sortOrder: editImages.length }]);
    await refreshEditImages();
    runSearch();
  };

  document.getElementById('btn-edit-save').onclick = async () => {
    await updatePost(editPostId, {
      title: document.getElementById('e-title').value.trim(),
      category: document.getElementById('e-category').value,
      isLiked: document.getElementById('e-liked').checked,
      isOwned: document.getElementById('e-category').value === 'video'
        ? document.getElementById('e-owned').checked : null,
      productionDate: document.getElementById('e-date').value || null,
      productionDatePrecision: document.getElementById('e-date-precision').value,
      comment: document.getElementById('e-comment').value.trim() || null,
      sourceUrl: document.getElementById('e-source-url').value.trim() || null,
    });
    await replaceTags(editPostId, {
      content: eContentTags.getTags(),
      person: ePersonTags.getTags(),
      creator: eCreatorTags.getTags(),
    });
    dlgEdit.close();
    runSearch();
  };
  document.getElementById('btn-edit-cancel').onclick = () => dlgEdit.close();

  document.getElementById('btn-e-usage-plus').onclick = async () => {
    await incrementUsageCount(editPostId);
    updateUsageDeleteUI(await getPost(editPostId));
    runSearch();
  };
  document.getElementById('btn-e-usage-minus').onclick = async () => {
    await decrementUsageCount(editPostId);
    updateUsageDeleteUI(await getPost(editPostId));
    runSearch();
  };
  document.getElementById('btn-e-delete').onclick = async () => {
    const ok = await confirmAction('この投稿を削除しますか？(あとで復元できます)');
    if (!ok) return;
    await softDeletePost(editPostId);
    dlgEdit.close();
    runSearch();
  };
  document.getElementById('btn-e-restore').onclick = async () => {
    await restorePost(editPostId);
    dlgEdit.close();
    runSearch();
  };

  // ---- 画像ビューアー ----
  const dlgViewer = document.getElementById('dlg-viewer');
  const viewerImg = document.getElementById('viewer-img');
  const viewerCaption = document.getElementById('viewer-caption');
  const viewerPrevBtn = document.getElementById('btn-viewer-prev');
  const viewerNextBtn = document.getElementById('btn-viewer-next');
  let viewerImages = [];
  let viewerIndex = 0;

  async function openViewer(postId) {
    const account = await getOneDriveAccount();
    if (!account) {
      alert('先にヘッダーの「OneDriveに接続」からログインしてください');
      return;
    }
    const images = await listImages(postId);
    if (images.length === 0) {
      alert('この投稿には画像が登録されていません');
      return;
    }
    viewerImages = images;
    viewerIndex = 0;
    const showNav = viewerImages.length > 1;
    viewerPrevBtn.style.display = showNav ? '' : 'none';
    viewerNextBtn.style.display = showNav ? '' : 'none';
    dlgViewer.showModal();
    renderViewerImage();
  }

  async function renderViewerImage() {
    const img = viewerImages[viewerIndex];
    viewerCaption.textContent = `${viewerIndex + 1} / ${viewerImages.length}`;
    viewerImg.removeAttribute('src');
    viewerImg.alt = '読み込み中…';
    try {
      const url = await getDownloadUrl(img.onedrive_drive_id, img.onedrive_item_id);
      if (url) {
        viewerImg.src = url;
        viewerImg.alt = '';
      } else {
        viewerImg.alt = '画像を取得できませんでした';
      }
    } catch {
      viewerImg.alt = '画像を取得できませんでした';
    }
  }

  viewerPrevBtn.onclick = () => {
    viewerIndex = (viewerIndex - 1 + viewerImages.length) % viewerImages.length;
    renderViewerImage();
  };
  viewerNextBtn.onclick = () => {
    viewerIndex = (viewerIndex + 1) % viewerImages.length;
    renderViewerImage();
  };
  document.getElementById('btn-viewer-close').onclick = () => dlgViewer.close();

  // ダイアログ表示中は矢印キーで前後の画像に移動できるようにする
  document.addEventListener('keydown', (e) => {
    if (!dlgViewer.open) return;
    if (e.key === 'ArrowLeft') viewerPrevBtn.click();
    if (e.key === 'ArrowRight') viewerNextBtn.click();
  });
</script>

</body>
</html>
